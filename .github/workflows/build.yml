name: Build installers

# Manual + tag-triggered. Produces the per-OS installers that make Claudible a one-click install (no git
# clone / npm / build toolchain for end users). A manual (workflow_dispatch) run uploads CI artifacts only.
# A v* TAG additionally PUBLISHES the Windows installer to a GitHub Release (public download). The default
# GITHUB_TOKEN with contents:write can create the release in our own repo (no PAT).
# Linux/macOS stay artifact-only until their installers are validated.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release + upload the installer asset (publish step below)

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      # Guard: a v* tag MUST match package.json version, so the published asset (named from package.json's
      # version via artifactName) can never diverge from the Release (named from the tag). Fails fast, before
      # the expensive build. ALL legs (B-roadmap 4.3): since the publish job below ships Linux assets too, a
      # mismatched tag must kill every leg, not just the one that used to publish.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag · package.json=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::release tag v$tag does not match package.json $pkg — bump package.json to match the tag"; exit 1; }

      - name: Install dependencies
        run: npm ci

      # node-pty 1.1.0 ships prebuilds for win32 + darwin but NOT linux.
      # node-pty-prebuilt-multiarch carries the linux prebuilds; ptyInfo() falls
      # back to it at runtime. Add it only on the Linux runner (keeps win/mac lean).
      - name: Linux node-pty fallback
        if: matrix.os == 'ubuntu-latest'
        run: npm install --no-save node-pty-prebuilt-multiarch@^0.10.1-pre.5

      # AppImage needs FUSE; the deb target needs no extra system deps.
      - name: Linux packaging prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 || true

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      - name: Build (macOS, unsigned)
        if: matrix.os == 'macos-latest'
        # No code-signing identity in CI yet — produces an unsigned .dmg.
        # Signing/notarization (C4) is wired separately once an Apple cert is in secrets.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      # The publish job below draws its assets from THESE artifacts, so on a tag this upload is load-bearing,
      # not a convenience: a failed upload surfaces later as fail_on_unmatched_files in publish. It stays
      # continue-on-error so a workflow_dispatch run (no publish) never dies to a storage hiccup — the old
      # v0.8.0 quota lesson no longer applies for tags (the repo is public; artifact storage is not the old
      # 500 MB private-repo pool), and the publish job is where a genuinely missing asset gets loud.
      - name: Upload installers
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: claudible-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
          if-no-files-found: warn
          retention-days: 14

  # ONE publish job, not three legs racing softprops/action-gh-release over one release (the roadmap's 4.3
  # hazard note). `always()` + needs: a flaky macOS leg must not block a release whose Windows and Linux
  # assets built fine — fail_on_unmatched_files is the real gate: if an asset we PROMISE is missing, no
  # release. What we promise as of 0.9.3: the Windows .exe, the Linux AppImage and .deb. The macOS .dmg is
  # DELIBERATELY not in `files` — unsigned, unnotarized, never run on hardware (roadmap B3 / decision 1);
  # it stays an artifact until that decision is made. Unsigned Windows: SmartScreen will warn on first run
  # ("More info → Run anyway") — expected until a code-signing cert exists (roadmap B11).
  publish:
    name: publish (tag only)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4   # for CHANGELOG.md

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          pattern: claudible-*
          path: dist
          merge-multiple: true

      # Release notes. Every release up to 0.9.0 published with an EMPTY body — a downloader got a bare .exe
      # and not one word about what changed. CHANGELOG.md already HAS the text; cut this version's section out
      # of it (from `## [x.y.z]` up to the next `## [`) and use that as the body. `|| true`: GHA runs under
      # `bash -eo pipefail`, and a cosmetic notes problem must never block a release that already built —
      # degrade to a link instead.
      - name: Extract this version's CHANGELOG section
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; print; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            printf '%s\n' "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > RELEASE_NOTES.md
          fi
          echo "--- release body ---"; cat RELEASE_NOTES.md
          echo "--- assets ---"; ls -la dist/

      - name: Publish installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
