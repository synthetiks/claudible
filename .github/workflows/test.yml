name: Tests

# Two gates. `test` is the pure-Node+bash acceptance suite (parity across backends, the win.js core, live
# Posix runScript, hooks parity, python3->Node port parity) — no npm install, no Electron, no display, fast.
# `lint` installs deps and runs ESLint (correctness rules — no-undef, no-unused-vars, …) + shellcheck over the
# wsl scripts, which eat collaborator- and repo-controlled input.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      # The suite needs no npm deps (pure Node + bash); python3 is preinstalled on
      # ubuntu-latest, which the port-parity test uses to diff old-vs-new output.
      - name: Runner + hooks + port parity suite
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      # shellcheck ships on ubuntu-latest. --severity=error only (real bugs, not style); every wsl/*.sh already
      # passes `bash -n`, so this is a genuine gate, not a nitpick wall. SC1091 = "can't follow sourced file"
      # (we source _git-safe.sh / node-path.sh by a runtime-resolved path shellcheck can't statically follow).
      - name: shellcheck (wsl scripts)
        run: shellcheck --severity=error -e SC1091 wsl/*.sh

  # Boots the REAL Electron app and drives the renderer over CDP — the only gate that can catch a TDZ error, a
  # missing preload export, or a renderer syntax error before a human opens the app. Its own job: an ephemeral
  # container with a virtual display, so it can never touch a developer's live registry. It refuses to run
  # without CLAUDIBLE_E2E=1 and without a temp HOME/CLAUDIBLE_RUNTIME (see the header of test/e2e-boot.test.js).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Virtual display + Electron runtime libs
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libgbm1 libasound2t64
      - name: Boot smoke (real Electron, isolated HOME)
        run: xvfb-run -a npm run test:e2e
        env:
          CLAUDIBLE_E2E: "1"

  # `electron-builder --dir` assembles the unpacked app on all three OSes WITHOUT building installers (no NSIS,
  # no dmg/AppImage, no FUSE, no signing) — fast, and it needs no secrets. build.yml is tag/dispatch-only, so
  # without this a change that breaks packaging (a bad build.files glob, a missing runtime dep, an asar issue)
  # would not surface until tag day, on the one workflow nobody runs during development. This catches it on every
  # push to main. fail-fast:false so a Windows-only break still shows the Linux/mac result.
  pack:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Mirror build.yml: node-pty 1.1.0 has no linux prebuild, so the packaged app would fail to assemble the
      # native module on the Linux runner without the multiarch fallback ptyInfo() loads at runtime.
      - name: Linux node-pty fallback
        if: matrix.os == 'ubuntu-latest'
        run: npm install --no-save node-pty-prebuilt-multiarch@^0.10.1-pre.5
      - name: Assemble the unpacked app (no installer)
        run: npx electron-builder --dir
