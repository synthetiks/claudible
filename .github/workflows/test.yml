name: Tests

# Two gates. `test` is the acceptance suite (parity across backends, the win.js core, live Posix runScript,
# hooks parity, python3->Node port parity) — prod deps only, no Electron, no display, fast.
# `lint` installs deps and runs ESLint (correctness rules — no-undef, no-unused-vars, …) + shellcheck over the
# wsl scripts, which eat collaborator- and repo-controlled input.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      # `ws` IS required, despite the old "needs no npm deps" claim: share/server.js requires it, and without it
      # test/share-names.test.js catches the module error and skips Parts B/C/D — resume, supersede-zombie-socket,
      # roster-bound, voice-relay-dedup — while still printing "0 failed" and exiting 0. So the deepest live-share
      # coverage in the suite never ran in CI, and the green check said otherwise.
      # --omit=dev keeps Electron out (this job needs none of it) and --ignore-scripts skips node-pty's native
      # build, which the suite never loads — together they buy the real coverage without slowing the fast gate.
      # python3 is preinstalled on ubuntu-latest; port-parity uses it to diff old-vs-new output.
      - name: Install runtime deps the suite actually needs (ws)
        run: npm ci --omit=dev --ignore-scripts
      - name: Runner + hooks + port parity suite
        run: npm test

  # C-11.6 / roadmap §7 decision 5: the shipped Windows runner's own code had zero automated coverage before
  # this job — only the Linux `test` job above ran the suite. This does NOT run the full suite: gh-auth and
  # every shell test still need things a plain windows-latest runner can't promise, so it runs the explicit
  # --windows-safe subset (test/run-all.js decides that list, not this YAML — one place, not a duplicate).
  # windows-latest DOES ship Git Bash (test/_bash-resolve.js's C-1.4 discovery would find it), but that isn't
  # enough on its own for network/gh-auth-dependent tests, so those stay out regardless.
  # .gitattributes' eol pins (C-10.3) mean this checkout is byte-identical to the Linux one — no CRLF-vs-LF
  # phantom failures here.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install runtime deps the suite actually needs (ws)
        run: npm ci --omit=dev --ignore-scripts
      - name: Windows-safe subset (contract + pure-node tests, no bash/WSL/python3/gh)
        run: npm run test:windows-safe

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      # shellcheck ships on ubuntu-latest. --severity=error only (real bugs, not style); every wsl/*.sh already
      # passes `bash -n`, so this is a genuine gate, not a nitpick wall. SC1091 = "can't follow sourced file"
      # (we source _git-safe.sh / node-path.sh by a runtime-resolved path shellcheck can't statically follow).
      - name: shellcheck (wsl + setup scripts)
        run: shellcheck --severity=error -e SC1091 wsl/*.sh setup/setup.sh

  # Boots the REAL Electron app and drives the renderer over CDP — the only gate that can catch a TDZ error, a
  # missing preload export, or a renderer syntax error before a human opens the app. Its own job: an ephemeral
  # container with a virtual display, so it can never touch a developer's live registry. It refuses to run
  # without CLAUDIBLE_E2E=1 and without a temp HOME/CLAUDIBLE_RUNTIME (see the header of test/e2e-boot.test.js).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Virtual display + Electron runtime libs
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libgbm1 libasound2t64
      - name: Boot smoke (real Electron, isolated HOME)
        run: xvfb-run -a npm run test:e2e
        env:
          CLAUDIBLE_E2E: "1"

  # `electron-builder --dir` assembles the unpacked app on all three OSes WITHOUT building installers (no NSIS,
  # no dmg/AppImage, no FUSE, no signing) — fast, and it needs no secrets. build.yml is tag/dispatch-only, so
  # without this a change that breaks packaging (a bad build.files glob, a missing runtime dep, an asar issue)
  # would not surface until tag day, on the one workflow nobody runs during development. This catches it on every
  # push to main. fail-fast:false so a Windows-only break still shows the Linux/mac result.
  pack:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Mirror build.yml: node-pty 1.1.0 has no linux prebuild, so the packaged app would fail to assemble the
      # native module on the Linux runner without the multiarch fallback ptyInfo() loads at runtime.
      - name: Linux node-pty fallback
        if: matrix.os == 'ubuntu-latest'
        run: npm install --no-save node-pty-prebuilt-multiarch@^0.10.1-pre.5
      - name: Assemble the unpacked app (no installer)
        run: npx electron-builder --dir
